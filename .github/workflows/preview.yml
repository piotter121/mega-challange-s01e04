name: Preview digest

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker in this temporary review preview
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LANE_ID: lane-07
      LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Export digest
        run: scripts/export-preview.sh "$RUNNER_TEMP/rig-preview"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rig-preview

      - id: deployment
        uses: actions/deploy-pages@v4
